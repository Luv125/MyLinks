<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Personal Links</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --gold:#ffd700;
  --gold-glow:#ffed4e;
  --blue:#4dabf7;
  --blue-glow:#69db7c;
  --red:#ff6b6b;
  --red-glow:#ff8787;
  --purple:#cc5de8;
  --purple-glow:#e599f7;
  --bg-dark:#0a0a2a;
  --card-light:#ffffff;
  --text-dark:#f2f2f2;
  --text-light:#1b1b1b;
  --radius:26px;
  --shadow:0 12px 35px rgba(0,0,0,.35);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;
  outline:none;
}

body{
  min-height:100vh;
  background:var(--bg-dark);
  color:var(--text-dark);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  position: relative;
  overflow: hidden;
}

/* خلفية متدرجة */
body::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 20% 80%, rgba(255, 215, 0, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(77, 171, 247, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 40% 40%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
    radial-gradient(circle at 60% 60%, rgba(204, 93, 232, 0.1) 0%, transparent 50%);
  z-index:-2;
}

/* تأثير بلوري للخلفية */
.glass-bg{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  z-index:-1;
}

/* تأثيرات التوهج المتحركة */
.glow-effect{
  position:absolute;
  border-radius:50%;
  filter:blur(40px);
  opacity:0.6;
  animation:float 8s infinite ease-in-out;
  z-index:-1;
}

.glow-1{
  width:300px;
  height:300px;
  background:var(--gold);
  top:10%;
  left:10%;
  animation-delay:0s;
}

.glow-2{
  width:250px;
  height:250px;
  background:var(--blue);
  top:60%;
  right:10%;
  animation-delay:2s;
}

.glow-3{
  width:200px;
  height:200px;
  background:var(--red);
  bottom:10%;
  left:20%;
  animation-delay:4s;
}

.glow-4{
  width:180px;
  height:180px;
  background:var(--purple);
  top:20%;
  right:20%;
  animation-delay:6s;
}

@keyframes float{
  0%, 100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-20px) scale(1.05);}
}

/* الكارت الرئيسي */
.card{
  width:100%;
  max-width:520px;
  background:rgba(30, 30, 60, 0.7);
  border-radius:var(--radius);
  padding:34px 30px;
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  border:1px solid rgba(255, 255, 255, 0.1);
  box-shadow:
    0 12px 35px rgba(0,0,0,.5),
    0 0 0 1px rgba(255, 255, 255, 0.05),
    inset 0 0 0 1px rgba(255, 255, 255, 0.05);
  position:relative;
  overflow:hidden;
}

.card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:5px;
  background:linear-gradient(90deg, var(--gold), var(--blue), var(--red), var(--purple), var(--gold));
  background-size:200% 100%;
  animation:shimmer 3s linear infinite;
}

@keyframes shimmer{
  0%{background-position:200% 0;}
  100%{background-position:-200% 0;}
}

.header{
  margin-bottom:26px;
  text-align:center;
}

h1{
  font-size:32px;
  font-weight:700;
  background:linear-gradient(90deg, var(--gold), var(--blue), var(--red), var(--purple));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  background-size:200% auto;
  animation:gradient 3s linear infinite;
  margin-bottom:8px;
}

@keyframes gradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.username{
  font-size:24px;
  color:var(--gold);
  font-weight:600;
  margin-bottom:5px;
  text-shadow:0 0 10px rgba(255, 215, 0, 0.5);
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%, 100%{opacity:1;}
  50%{opacity:0.8;}
}

.desc{
  opacity:.8;
  margin-top:6px;
  font-size:15px;
}

/* الروابط */
.links-container{
  margin-top:20px;
}

.link{
  display:flex;
  align-items:center;
  gap:18px;
  padding:18px 20px;
  margin:14px 0;
  border-radius:20px;
  color:#fff;
  text-decoration:none;
  font-size:17px;
  font-weight:500;
  background:rgba(255, 255, 255, 0.08);
  border:1px solid rgba(255, 255, 255, 0.1);
  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
}

.link::before{
  content:'';
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
  transition:left 0.7s;
}

.link:hover::before{
  left:100%;
}

.link:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(0, 0, 0, 0.3);
  border-color:rgba(255, 255, 255, 0.2);
}

.link:nth-child(1):hover{background:linear-gradient(135deg, rgba(255, 107, 107, 0.2), rgba(255, 107, 107, 0.4));}
.link:nth-child(2):hover{background:linear-gradient(135deg, rgba(77, 171, 247, 0.2), rgba(77, 171, 247, 0.4));}
.link:nth-child(3):hover{background:linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.4));}
.link:nth-child(4):hover{background:linear-gradient(135deg, rgba(204, 93, 232, 0.2), rgba(204, 93, 232, 0.4));}

.icon{
  width:46px;
  height:46px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  transition:all 0.3s ease;
}

.link:nth-child(1) .icon{background:rgba(255, 107, 107, 0.2); color:var(--red);}
.link:nth-child(2) .icon{background:rgba(77, 171, 247, 0.2); color:var(--blue);}
.link:nth-child(3) .icon{background:rgba(255, 215, 0, 0.2); color:var(--gold);}
.link:nth-child(4) .icon{background:rgba(204, 93, 232, 0.2); color:var(--purple);}

.link:hover .icon{
  transform:scale(1.1) rotate(5deg);
}

.link:nth-child(1):hover .icon{box-shadow:0 0 15px rgba(255, 107, 107, 0.5);}
.link:nth-child(2):hover .icon{box-shadow:0 0 15px rgba(77, 171, 247, 0.5);}
.link:nth-child(3):hover .icon{box-shadow:0 0 15px rgba(255, 215, 0, 0.5);}
.link:nth-child(4):hover .icon{box-shadow:0 0 15px rgba(204, 93, 232, 0.5);}

/* الإعدادات */
.settings{
  position:fixed;
  top:18px;
  right:18px;
  display:flex;
  gap:10px;
  z-index:10;
}

.btn{
  width:46px;
  height:46px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  background:rgba(30, 30, 60, 0.7);
  color:var(--gold);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255, 255, 255, 0.1);
  box-shadow:var(--shadow);
  font-size:18px;
  transition:all 0.3s ease;
}

.btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 15px rgba(255, 215, 0, 0.3);
}

/* Toast */
.toast{
  position:fixed;
  bottom:-90px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(30, 30, 60, 0.8);
  color:var(--text-dark);
  padding:14px 24px;
  border-radius:18px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255, 255, 255, 0.1);
  opacity:0;
  transition:.4s ease;
  z-index:100;
}

.toast.show{bottom:26px;opacity:1}

/* Modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:100;
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

.modal.show{
  opacity:1;
  pointer-events:auto;
}

.modal-box{
  background:rgba(30, 30, 60, 0.9);
  padding:26px;
  border-radius:22px;
  width:90%;
  max-width:340px;
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  border:1px solid rgba(255, 255, 255, 0.1);
  box-shadow:
    0 12px 35px rgba(0,0,0,.5),
    0 0 0 1px rgba(255, 255, 255, 0.05);
}

.modal-box h2{
  margin-bottom:20px;
  font-size:20px;
  color:var(--gold);
  text-align:center;
}

.lang-option{
  padding:14px;
  margin:10px 0;
  border-radius:16px;
  cursor:pointer;
  background:rgba(255, 255, 255, 0.08);
  color:var(--text-dark);
  border:1px solid rgba(255, 255, 255, 0.1);
  transition:all 0.3s ease;
  text-align:center;
}

.lang-option:hover{
  background:linear-gradient(135deg, var(--gold), #f7d774);
  color:#000;
  transform:translateY(-3px);
}

/* Light mode */
.light{
  background:#f0f8ff;
  color:var(--text-light);
}

.light .card,
.light .btn,
.light .toast,
.light .modal-box{
  background:rgba(255, 255, 255, 0.8);
  color:var(--text-light);
}

.light .lang-option{
  background:rgba(0, 0, 0, 0.05);
}

.light .link{
  background:rgba(0, 0, 0, 0.05);
  color:var(--text-light);
}

/* تأثيرات جمالية */
.sparkle{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--gold);
  animation:sparkle 1.5s infinite;
  z-index:-1;
}

@keyframes sparkle{
  0%, 100%{opacity:0; transform:scale(0);}
  50%{opacity:1; transform:scale(1);}
}

.floating-icon{
  position:absolute;
  font-size:24px;
  color:var(--gold);
  opacity:0.3;
  animation:float-icon 10s infinite linear;
  z-index:-1;
}

@keyframes float-icon{
  0%{transform:translateY(0) rotate(0deg);}
  100%{transform:translateY(-100vh) rotate(360deg);}
}
</style>
</head>

<body>

<div class="glass-bg"></div>

<!-- تأثيرات التوهج -->
<div class="glow-effect glow-1"></div>
<div class="glow-effect glow-2"></div>
<div class="glow-effect glow-3"></div>
<div class="glow-effect glow-4"></div>

<div class="settings">
  <button id="theme" class="btn">
    <i class="fa-solid fa-moon"></i>
  </button>
  <button id="openLang" class="btn">
    <i class="fa-solid fa-globe"></i>
  </button>
</div>

<div class="card">
  <div class="header">
    <h1 id="title">45c95 Links</h1>
    <div class="username">@45c95</div>
    <p class="desc" id="desc">Personal links and projects</p>
    <p class="desc">Made with <i class="fas fa-heart" style="color:#ff6b6b;"></i> by 45c95</p>
  </div>
  <div class="links-container" id="links"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Language Modal -->
<div class="modal" id="langModal">
  <div class="modal-box">
    <h2>Choose Language</h2>
    <div class="lang-option" onclick="setLang('en')">English</div>
    <div class="lang-option" onclick="setLang('ar')">العربية</div>
  </div>
</div>

<script>
const data={
 en:[
  ["YouTube","https://www.youtube.com/@Lvvu125","fab fa-youtube"],
  ["Username Generator","https://luv125.github.io/TakeUser/","fa-solid fa-user-gear"],
  ["Instagram","https://www.instagram.com/xeon2026","fab fa-instagram"],
  ["Telegram","https://t.me/Sir45c95","fab fa-telegram"]
 ],
 ar:[
  ["يوتيوب","https://www.youtube.com/@Lvvu125","fab fa-youtube"],
  ["مولد يوزرات","https://luv125.github.io/TakeUser/","fa-solid fa-user-gear"],
  ["إنستغرام","https://www.instagram.com/xeon2026","fab fa-instagram"],
  ["تيليغرام","https://t.me/Sir45c95","fab fa-telegram"]
 ]
}

const titles={
 en:["45c95 Links","Personal links and projects","Made with ❤️ by 45c95"],
 ar:["روابط 45c95","روابط ومشاريع شخصية","صنع بـ ❤️ بواسطة 45c95"]
}

let lang=localStorage.lang||"en"
let light=localStorage.theme==="light"

const links=document.getElementById("links")
const modal=document.getElementById("langModal")
const toast=document.getElementById("toast")
const title=document.getElementById("title")
const desc=document.getElementById("desc")

function showToast(t){
 toast.textContent=t
 toast.classList.add("show")
 setTimeout(()=>toast.classList.remove("show"),2000)
}

function render(){
 links.innerHTML=""
 data[lang].forEach((l, index)=>{
  links.innerHTML+=`
   <a class="link" href="${l[1]}" target="_blank">
    <div class="icon"><i class="${l[2]}"></i></div>${l[0]}
   </a>`
 })
 
 title.textContent=titles[lang][0]
 desc.textContent=titles[lang][1]
 document.documentElement.dir=lang==="ar"?"rtl":"ltr"
}

function setLang(l){
 lang=l
 localStorage.lang=l
 modal.classList.remove("show")
 render()
 showToast(l==="en"?"English selected":"تم اختيار العربية")
 createSparkles(8);
}

// إنشاء تأثيرات جمالية
function createSparkles(count){
 for(let i=0;i<count;i++){
  const sparkle=document.createElement('div')
  sparkle.classList.add('sparkle')
  
  const colors=[getComputedStyle(document.documentElement).getPropertyValue('--gold'),
                getComputedStyle(document.documentElement).getPropertyValue('--blue'),
                getComputedStyle(document.documentElement).getPropertyValue('--red'),
                getComputedStyle(document.documentElement).getPropertyValue('--purple')]
  
  sparkle.style.background=colors[Math.floor(Math.random()*colors.length)]
  
  const left=Math.random()*100
  const top=Math.random()*100
  
  sparkle.style.left=left+'vw'
  sparkle.style.top=top+'vh'
  
  const size=Math.random()*6+2
  sparkle.style.width=size+'px'
  sparkle.style.height=size+'px'
  
  const duration=Math.random()*1+1
  sparkle.style.animationDuration=duration+'s'
  
  const delay=Math.random()*2
  sparkle.style.animationDelay=delay+'s'
  
  document.body.appendChild(sparkle)
  
  setTimeout(()=>{
   sparkle.remove()
  }, (duration+delay)*1000)
 }
}

function createFloatingIcons(){
 const icons=['fas fa-star','fas fa-heart','fas fa-circle','fas fa-square','fas fa-diamond']
 const icon=document.createElement('i')
 icon.classList.add('floating-icon')
 
 icon.className=icons[Math.floor(Math.random()*icons.length)]
 
 const left=Math.random()*100
 icon.style.left=left+'vw'
 
 const size=Math.random()*20+10
 icon.style.fontSize=size+'px'
 
 const duration=Math.random()*15+10
 icon.style.animationDuration=duration+'s'
 
 document.body.appendChild(icon)
 
 setTimeout(()=>{
  icon.remove()
 }, duration*1000)
}

theme.onclick=()=>{
 light=!light
 document.body.classList.toggle("light",light)
 localStorage.theme=light?"light":"dark"
 theme.innerHTML=light?'<i class="fa-solid fa-sun"></i>':'<i class="fa-solid fa-moon"></i>'
 
 // إنشاء تأثيرات عند التبديل
 createSparkles(5);
 if(!light) createFloatingIcons();
}

openLang.onclick=()=>{
 modal.classList.add("show");
 createSparkles(6);
}

modal.onclick=e=>{
 if(e.target===modal){
  modal.classList.remove("show")
  createSparkles(3);
 }
}

// تهيئة التأثيرات
document.addEventListener('DOMContentLoaded', function(){
 render();
 
 // إنشاء تأثيرات بشكل دوري
 setInterval(() => {
  if(Math.random() > 0.7) createSparkles(2);
  if(Math.random() > 0.9) createFloatingIcons();
 }, 4000);
 
 // إنشاء تأثيرات عند النقر على الروابط
 document.querySelectorAll('.link').forEach(link => {
  link.addEventListener('click', function() {
   createSparkles(4);
  });
 });
});

// إنشاء تأثيرات عند تحريك الماوس
document.addEventListener('mousemove', function(e){
 if(Math.random() > 0.97){
  createSparkles(1);
 }
});
</script>

</body>
</html>
